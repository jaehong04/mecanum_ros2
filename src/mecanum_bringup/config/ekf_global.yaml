ekf_global_filter_node:
  ros__parameters:

    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: true

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # ============================================================
    # Wheel Odometry
    # vx, vy, vyaw 사용
    # ============================================================

    odom0: /mecanum_drive_controller/odometry

    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]

    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ============================================================
    # WitMotion IMU
    # Gyro Z만 사용
    # ============================================================

    imu0: /imu/data

    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

    # ============================================================
    # External Camera
    # 절대 X / Y / Yaw
    # ============================================================

    pose0: /external_camera/pose

    pose0_config: [
      true,  true,  false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]

    pose0_queue_size: 10
    pose0_differential: false
    pose0_relative: false
